name: Fix Original AppKiller APK

on:
  push:
    branches: [ main ]

jobs:
  fix-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

      - name: Download uber-apk-signer
        run: |
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

      - name: Decompile original APK
        run: |
          java -jar apktool.jar d original-apk/appkiller_orig.apk -o decoded -f

      - name: Patch integrity check - bypass SavesRestoringPortable.DoSmth
        run: |
          # Remove the DoSmth call in App.smali that causes crash on re-signed APK
          sed -i '/invoke-static\/range {p0 .. p0}, Lcom\/TryRoom\/SavesRestoringPortable;->DoSmth(Landroid\/content\/Context;)V/d' decoded/smali/com/redsoft/appkiller/App.smali
          echo "=== Patched App.smali onCreate ==="
          grep -A 20 "onCreate" decoded/smali/com/redsoft/appkiller/App.smali | head -25

      - name: Recompile APK
        run: |
          java -jar apktool.jar b decoded -o appkiller-fixed-unsigned.apk

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar -a appkiller-fixed-unsigned.apk -o signed-output
          ls -la signed-output/
          cp signed-output/appkiller-fixed-unsigned-aligned-debugSigned.apk appkiller-fixed.apk 2>/dev/null || cp signed-output/*.apk appkiller-fixed.apk

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: appkiller-fixed-apk
          path: appkiller-fixed.apk
