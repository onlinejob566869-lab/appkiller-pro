name: Fix and Build APK

on:
  push:
    branches: [ main ]

jobs:
  fix-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          chmod +x apktool

      - name: Download uber-apk-signer
        run: |
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

      - name: Decompile original APK
        run: |
          java -jar apktool.jar d original-apk/app-debug.apk -o decoded -f

      - name: Fix splash_background.xml
        run: |
          cat > decoded/res/drawable/splash_background.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list
            xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/primary" />
          </layer-list>
          XMLEOF
          echo "Fixed splash_background.xml:"
          cat decoded/res/drawable/splash_background.xml

      - name: Recompile APK
        run: |
          java -jar apktool.jar b decoded -o appkiller-fixed-unsigned.apk

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar -a appkiller-fixed-unsigned.apk -o signed-output
          cp signed-output/appkiller-fixed-unsigned-debug.apk appkiller-fixed.apk || cp signed-output/*.apk appkiller-fixed.apk

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: appkiller-fixed-apk
          path: appkiller-fixed.apk
